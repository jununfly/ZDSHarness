- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 1000000
        maxTokens: 32768

- id: github
  name: '@deepseek-ai/dsh-github'

- id: github-fixture
  name: './tests/fixtures/github-provider.ts'

- id: tool-research
  name: '@deepseek-ai/dsh-tool-research'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: tool-research-report
  name: '@deepseek-ai/dsh-tool-research-report'

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [2, 3, 5]
    include: [research_collect_evidence]

- id: research-policy
  name: './src/research-policy.ts'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: You are a technical solution research agent.
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none
